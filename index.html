<style>
/* Layout: dark-first game-studio showcase. Hero with three game covers, a band of big numbers,
   then one wide "case" per shipped game (media + gallery + role), open source, toolbox, career, contact. */
:root {
  --bg: #0b0d12;
  --surface: #141821;
  --surface-2: #1b2130;
  --fg: #eef1f6;
  --muted: #8e98ab;
  --line: #262d3b;
  --accent: #ffb547;
  --link: #8fb4ff;
  --scrim: rgba(6, 8, 12, .86);
  --f-display: "Unbounded", "Segoe UI", system-ui, sans-serif;
  --f-body: "Golos Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f2f3f6; --surface: #ffffff; --surface-2: #e9ecf2; --fg: #11141b; --muted: #5a6274;
    --line: #d7dbe4; --accent: #b25f00; --link: #2a55c8; --scrim: rgba(15, 18, 26, .82);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f2f3f6; --surface: #ffffff; --surface-2: #e9ecf2; --fg: #11141b; --muted: #5a6274;
  --line: #d7dbe4; --accent: #b25f00; --link: #2a55c8; --scrim: rgba(15, 18, 26, .82);
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 16px; line-height: 1.6;
  margin: 0; padding-inline: 20px; padding-block: 0 56px;
}
a { color: var(--link); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
img, video { max-width: 100%; display: block; }
.wrap { max-width: 1160px; margin: 0 auto; }
.mono { font-family: var(--f-mono); }
.label { font: 500 11.5px/1.3 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* bar */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding-block: 14px; background: var(--bg); border-bottom: 1px solid var(--line);
}
.bar .mark { display: inline-flex; align-items: center; gap: 10px; font: 600 14px/1 var(--f-display); letter-spacing: .01em; color: var(--fg); text-decoration: none; }
.bar .mark img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--accent); }
.bar nav { display: flex; gap: 22px; }
.bar nav a { color: var(--muted); text-decoration: none; font-size: 14px; }
.bar nav a:hover { color: var(--fg); }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.lang button { font: 500 12px/1 var(--f-mono); letter-spacing: .08em; border: 0; cursor: pointer; padding: 7px 12px; border-radius: 999px; background: transparent; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
@media (max-width: 820px) { .bar nav { display: none; } }

/* hero */
.hero { padding-block: 64px 40px; display: grid; gap: 40px; }
.hero h1 { font: 800 clamp(34px, 5vw, 68px)/.98 var(--f-display); letter-spacing: -.03em; margin: 0; text-wrap: balance; min-width: 0; }
.hero h1 span { color: var(--accent); }
.hero-top { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 48px; align-items: end; }
.player { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
.avatar { position: relative; flex: none; }
.zoom { border: 0; padding: 0; background: none; cursor: zoom-in; border-radius: 50%; }
.zoom img { transition: transform .2s; }
.zoom:hover img { transform: scale(1.05); }
.me-btn { display: block; margin-bottom: 18px; }
.avatar img { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); padding: 3px; background: var(--bg); }
.avatar::after { content: ""; position: absolute; right: 4px; bottom: 4px; width: 16px; height: 16px; border-radius: 50%; background: #3ccf7a; border: 3px solid var(--bg); }
.player b { display: block; font: 600 17px/1.25 var(--f-display); }
.player .st { font: 400 12.5px/1.4 var(--f-mono); color: var(--muted); }
.player .st::before { content: "● "; color: #3ccf7a; }
.hero .pitch { font-size: clamp(17px, 1.6vw, 20px); max-width: 46ch; margin: 0; color: var(--fg); }
.hero .pitch b { color: var(--accent); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.chip { font: 400 12.5px/1 var(--f-mono); padding: 8px 11px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
.chip.on { color: var(--fg); border-color: var(--accent); }
.chip.on::before { content: "● "; color: var(--accent); }
.cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
.btn { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 600; font-size: 15px; padding: 13px 20px; border-radius: 10px; border: 1px solid var(--line); color: var(--fg); background: var(--surface); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #17110a; }
.btn:hover { border-color: var(--fg); }
@media (max-width: 820px) { .hero-top { grid-template-columns: 1fr; } }

/* covers */
.covers { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 14px; }
.cover { position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 16 / 10; background: var(--surface-2); text-decoration: none; color: #fff; max-width: 100%; }
.cover img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
.cover:hover img { transform: scale(1.04); }
.cover .cap { position: absolute; inset: auto 0 0 0; padding: 40px 16px 14px; background: linear-gradient(transparent, rgba(5,7,10,.88)); display: grid; gap: 2px; }
.cover .cap b { font: 600 17px/1.2 var(--f-display); }
.cover .cap span { font: 400 12px/1.3 var(--f-mono); color: #d6dbe4; }
.cover .badge { position: absolute; top: 12px; left: 12px; font: 600 12px/1 var(--f-mono); padding: 7px 9px; border-radius: 6px; background: rgba(5,7,10,.72); color: #ffcf7f; }
@media (max-width: 820px) { .covers { grid-template-columns: 1fr 1fr; } .covers .cover:first-child { grid-column: 1 / -1; } }
@media (max-width: 480px) { .covers { grid-template-columns: 1fr; } }

/* numbers */
.numbers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-block: 1px solid var(--line); margin-top: 16px; }
.num { padding: 28px 20px 26px; border-right: 1px solid var(--line); display: grid; gap: 8px; align-content: start; container-type: inline-size; min-width: 0; }
.num:nth-child(4n) { border-right: 0; }
.num:nth-child(n+5) { border-top: 1px solid var(--line); }
.num strong { font: 800 clamp(18px, 19cqi, 56px)/1 var(--f-display); letter-spacing: -.03em; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
.num strong small { font-size: .42em; font-weight: 600; color: var(--fg); letter-spacing: 0; margin-left: 4px; }
.num p { margin: 0; font-size: 14.5px; color: var(--muted); max-width: 26ch; }
@media (max-width: 820px) {
  .numbers { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .num { border-right: 1px solid var(--line); }
  .num:nth-child(2n) { border-right: 0; }
  .num:nth-child(n+3) { border-top: 1px solid var(--line); }
  .num { padding: 20px 14px 18px; }
  .num p { font-size: 13.5px; }
}

/* sections */
section { padding-block: 72px 0; }
section, .case, .contact { scroll-margin-top: 84px; }
.sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
h2 { font: 600 clamp(26px, 3.4vw, 40px)/1.1 var(--f-display); letter-spacing: -.02em; margin: 0; text-wrap: balance; }

/* cases */
.cases { display: grid; gap: 64px; }
.case { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 36px; align-items: start; }
.case:nth-child(even) .media { order: 2; }
.media { display: grid; gap: 10px; min-width: 0; }
.stage { position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: var(--surface-2); max-width: 100%; }
.stage img, .stage video, .stage iframe { width: 100%; height: 100%; object-fit: cover; border: 0; }
.play { position: absolute; inset: 0; display: grid; place-items: center; background: linear-gradient(rgba(0,0,0,.05), rgba(0,0,0,.35)); border: 0; cursor: pointer; padding: 0; color: #fff; }
.play span { display: inline-flex; align-items: center; gap: 10px; font: 600 14px/1 var(--f-body); padding: 14px 20px 14px 16px; border-radius: 999px; background: rgba(5,7,10,.72); backdrop-filter: blur(4px); transition: transform .2s; }
.play span::before { content: ""; width: 0; height: 0; border-left: 13px solid var(--accent); border-block: 8px solid transparent; }
.play:hover span { transform: scale(1.05); }
.thumbs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.thumbs.tall { grid-template-columns: 1.8fr repeat(3, minmax(0, .62fr)); }
.thumb { border: 0; padding: 0; cursor: zoom-in; border-radius: 10px; overflow: hidden; background: var(--surface-2); aspect-ratio: 16 / 9; max-width: 100%; }
.thumbs.tall .thumb { aspect-ratio: auto; height: 120px; }
.thumb img { width: 100%; height: 100%; object-fit: cover; transition: opacity .2s; }
.thumb:hover img { opacity: .8; }
.info { display: grid; gap: 14px; min-width: 0; }
.info .studio { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.info h3 { font: 800 clamp(28px, 3.4vw, 42px)/1.02 var(--f-display); letter-spacing: -.03em; margin: 0; }
.info .tag { margin: 0; color: var(--muted); font-size: 16px; }
.kpis { display: flex; flex-wrap: wrap; gap: 10px; }
.kpi { padding: 12px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 2px; min-width: 120px; }
.kpi b { font: 600 22px/1.1 var(--f-display); color: var(--accent); letter-spacing: -.02em; }
.kpi span { font-size: 12.5px; color: var(--muted); }
.built { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 10px; }
.built li { padding-left: 22px; position: relative; }
.built li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 10px; height: 2px; background: var(--accent); }
.stack { display: flex; flex-wrap: wrap; gap: 6px; }
.stack span { font: 400 12px/1 var(--f-mono); padding: 6px 8px; border-radius: 5px; background: var(--surface-2); color: var(--muted); }
.links { display: flex; flex-wrap: wrap; gap: 16px; font-size: 14.5px; font-weight: 500; }
@media (max-width: 900px) {
  .case { grid-template-columns: 1fr; gap: 22px; }
  .case:nth-child(even) .media { order: 0; }
}
@media (max-width: 480px) { .thumbs.tall .thumb { height: 90px; } }

/* open source */
.oss { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.repo { display: grid; gap: 10px; align-content: start; padding: 24px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--fg); transition: border-color .2s, transform .2s; }
.repo:hover { border-color: var(--accent); transform: translateY(-2px); }
.repo .path { font: 400 12.5px/1.4 var(--f-mono); color: var(--muted); overflow-wrap: anywhere; }
.repo h3 { margin: 0; font: 600 19px/1.25 var(--f-display); letter-spacing: -.01em; }
.repo p { margin: 0; color: var(--muted); }
@media (max-width: 760px) { .oss { grid-template-columns: 1fr; } }

/* toolbox */
.tools { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px 32px; }
.tools h4 { margin: 0 0 10px; font: 600 15px/1.3 var(--f-body); }
.tools .stack span { font-size: 12.5px; padding: 7px 9px; color: var(--fg); }
@media (max-width: 900px) { .tools { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .tools { grid-template-columns: 1fr; } }

/* career */
.career { display: grid; border-top: 1px solid var(--line); }
.job { display: grid; grid-template-columns: 200px minmax(0, 1fr) auto; gap: 20px; padding-block: 18px; border-bottom: 1px solid var(--line); align-items: baseline; }
.job .yrs { font: 400 13px/1.4 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.job b { font-weight: 600; }
.job .game { color: var(--muted); }
.job .len { font: 400 13px/1.4 var(--f-mono); color: var(--muted); }
.edu { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; margin-top: 28px; }
.edu p { margin: 6px 0 0; }
@media (max-width: 700px) { .job { grid-template-columns: 1fr; gap: 2px; } .edu { grid-template-columns: 1fr; } }

/* contact */
.contact { margin-top: 72px; padding: clamp(28px, 5vw, 56px); border-radius: 20px; background: var(--surface); border: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 36px; }
.contact h2 { font-size: clamp(28px, 4vw, 48px); }
.contact h2 span { color: var(--accent); }
.contact .me { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); display: block; }
.contact .sub { color: var(--muted); margin: 14px 0 0; max-width: 40ch; }
.cts { display: grid; }
.ct { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding-block: 13px; border-bottom: 1px solid var(--line); }
.ct:last-child { border-bottom: 0; }
.ct .v { font-size: 16px; min-width: 0; overflow-wrap: anywhere; }
.copy { font: 500 12px/1 var(--f-mono); padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); cursor: pointer; }
.copy:hover { border-color: var(--accent); }
@media (max-width: 820px) { .contact { grid-template-columns: 1fr; } }
@media (max-width: 460px) { .ct { grid-template-columns: minmax(0, 1fr) auto; } .ct .label { grid-column: 1 / -1; } }

footer { margin-top: 40px; font: 400 12px/1.6 var(--f-mono); color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }

/* lightbox */
.lb { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: grid; place-items: center; padding: 24px; cursor: zoom-out; }
.lb img { max-height: 88vh; max-width: min(1400px, 100%); border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.lb button { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; font: 500 13px/1 var(--f-mono); padding: 10px 12px; border-radius: 8px; border: 0; background: rgba(255,255,255,.12); color: #fff; cursor: pointer; }

.pdfv { position: fixed; inset: 0; z-index: 60; background: var(--scrim); overflow-y: auto; padding: calc(64px + env(safe-area-inset-top, 0px)) 16px 32px; }
.pdfv .pages { display: grid; gap: 16px; justify-items: center; }
.pdfv canvas { width: min(900px, 100%); height: auto; border-radius: 6px; box-shadow: 0 20px 60px rgba(0,0,0,.5); background: #fff; }
.pdfv .pdf-bar { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; background: var(--scrim); color: #fff; font: 500 13px/1.3 var(--f-mono); }
.pdfv .pdf-bar button { font: 500 13px/1 var(--f-mono); padding: 10px 12px; border-radius: 8px; border: 0; background: rgba(255,255,255,.14); color: #fff; cursor: pointer; }
.pdfv .pdf-msg { color: #fff; text-align: center; font: 400 14px/1.5 var(--f-mono); }

@media (prefers-reduced-motion: reduce) {
  *, *::before { transition: none !important; }
}
</style>
</head>

function bind(t) {
  document.querySelectorAll(".copy").forEach(btn => btn.addEventListener("click", () => {
    const done = () => { btn.textContent = t.copied; setTimeout(() => btn.textContent = t.copy, 1400); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(btn.previousElementSibling); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
    try { navigator.clipboard.writeText(btn.dataset.v).then(done, fallback); } catch (e) { fallback(); }
  }));
  document.querySelectorAll(".play").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.yt;
    if (FRAMED) { window.open("https://www.youtube.com/watch?v=" + id, "_blank", "noopener"); return; }
    b.parentElement.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" title="Trailer" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  }));
  // inside a sandboxed frame window.open may be refused, so the play button falls back to a real link
  if (FRAMED) document.querySelectorAll(".play").forEach(b => {
    const a = document.createElement("a"); a.className = "play"; a.href = "https://www.youtube.com/watch?v=" + b.dataset.yt;
    a.target = "_blank"; a.rel = "noopener"; a.innerHTML = b.innerHTML; b.replaceWith(a);
  });
  document.querySelectorAll(".thumb, .zoom").forEach(b => b.addEventListener("click", () => openLb(b.dataset.full)));
  // the hub trailer starts muted once it scrolls into view and pauses when it leaves
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!calm && "IntersectionObserver" in window) {
    const io = new IntersectionObserver(es => es.forEach(e => {
      const v = e.target;
      if (e.isIntersecting) v.play().catch(() => {}); else if (v.muted) v.pause();
    }), { threshold: .5 });
    document.querySelectorAll("video.lazyplay").forEach(v => io.observe(v));
  }
}

const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
let pdfLib = null;
function loadPdfJs() {
  if (pdfLib) return pdfLib;
  pdfLib = new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = PDFJS + "pdf.min.js";
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js"; res(window.pdfjsLib); };
    s.onerror = rej; document.head.appendChild(s);
  });
  return pdfLib;
}
const pdfv = document.getElementById("pdfv"), pdfPages = document.getElementById("pdf-pages");
function closePdf() { pdfv.hidden = true; pdfPages.innerHTML = ""; document.body.style.overflow = ""; }
async function openPdf(href) {
  pdfv.hidden = false; document.body.style.overflow = "hidden";
  document.getElementById("pdf-name").textContent = href;
  pdfPages.innerHTML = '<p class="pdf-msg">Loading…</p>';
  document.getElementById("pdf-close").focus();
  try {
    const lib = await loadPdfJs();
    const data = await (await fetch(href)).arrayBuffer();
    const doc = await lib.getDocument({ data }).promise;
    pdfPages.innerHTML = "";
    for (let i = 1; i <= doc.numPages; i++) {
      const page = await doc.getPage(i), vp = page.getViewport({ scale: 2 });
      const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
      pdfPages.appendChild(c);
      await page.render({ canvasContext: c.getContext("2d"), viewport: vp, intent: "print" }).promise; // print intent skips requestAnimationFrame, which stalls in background tabs
    }
  } catch (e) {
    pdfPages.innerHTML = '<p class="pdf-msg">The CV could not be displayed here. Open the published site to download it.</p>';
  }
}
document.getElementById("pdf-close").addEventListener("click", closePdf);
pdfv.addEventListener("click", e => { if (e.target === pdfv || e.target === pdfPages) closePdf(); });
addEventListener("keydown", e => { if (e.key === "Escape" && !pdfv.hidden) closePdf(); });
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest("a.cv");
  if (!a || !FRAMED) return;
  e.preventDefault(); openPdf(a.getAttribute("href"));
});

function pickLang() {
  const h = location.hash.replace("#", "");
  if (h === "en" || h === "ru") return h;
  try { const s = localStorage.getItem("lang"); if (s === "en" || s === "ru") return s; } catch (e) {}
  return "en";
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  try { localStorage.setItem("lang", b.dataset.lang); } catch (e) {}
  render(b.dataset.lang);
}));
render(pickLang());
</script>
</body>
</html>
